# ============================================================
#   RankForge — Challenges Configuration
#   Define rank challenges that players can complete for rewards.
#
#   Supported types:
#     MINE_BLOCK  — Player breaks a block (BlockBreakEvent)
#     KILL_ENTITY — Player kills a mob or player (EntityDeathEvent)
#     CRAFT_ITEM  — Player crafts an item (CraftItemEvent)
#     RANKUP      — Player ranks up N times
#     MANUAL      — Progress added only via the API
#
#   Fields:
#     name           - Display name (shown in /rank challenges)
#     description    - Short description
#     type           - Challenge type (see above)
#     target-count   - How many times to complete the objective
#     reward-xp      - RankForge XP granted on completion (0 = none)
#     reward-money   - Vault money granted on completion (0.0 = none)
#     reward-commands- Console commands executed on completion (%player% supported)
#     rank-required  - Restrict to a specific rank ID (empty = all ranks)
#     repeatable     - Whether players can do this challenge repeatedly
#     cooldown-hours - Hours before a repeatable challenge resets
# ============================================================

challenges:

  daily_miner:
    name: "Daily Miner"
    description: "Mine 64 blocks today."
    type: MINE_BLOCK
    target-count: 64
    reward-xp: 150
    reward-money: 0.0
    reward-commands: []
    rank-required: ""
    repeatable: true
    cooldown-hours: 24

  mob_slayer:
    name: "Mob Slayer"
    description: "Kill 25 mobs."
    type: KILL_ENTITY
    target-count: 25
    reward-xp: 200
    reward-money: 0.0
    reward-commands: []
    rank-required: ""
    repeatable: true
    cooldown-hours: 24

  master_crafter:
    name: "Master Crafter"
    description: "Craft 10 items."
    type: CRAFT_ITEM
    target-count: 10
    reward-xp: 100
    reward-money: 50.0
    reward-commands: []
    rank-required: ""
    repeatable: true
    cooldown-hours: 24

  rank_climber:
    name: "Rank Climber"
    description: "Rank up 3 times."
    type: RANKUP
    target-count: 3
    reward-xp: 500
    reward-money: 1000.0
    reward-commands:
      - "give %player% diamond 2"
    rank-required: ""
    repeatable: false
    cooldown-hours: 0

  elite_miner:
    name: "Elite Miner"
    description: "Mine 500 blocks to prove your dedication."
    type: MINE_BLOCK
    target-count: 500
    reward-xp: 1000
    reward-money: 2500.0
    reward-commands:
      - "give %player% emerald 5"
    rank-required: "Expert"
    repeatable: false
    cooldown-hours: 0
