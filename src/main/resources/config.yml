# ============================================================
#   RankForge Configuration — v2.2
#   Author: JoshuaOP
# ============================================================

database:
  # Set type to "mysql" to use MySQL.
  # If MySQL connection fails, RankForge automatically falls back to YAML file storage.
  type: "mysql"
  host: "localhost"
  port: 3306
  name: "rankforge"
  user: "root"
  password: "password"
  pool-size: 10
  timeout: 5000

language:
  default: "en"
  per-player: true

# ── Anti-Abuse & Protection ───────────────────────────────────────────────────

anti-bypass:
  enabled: true
  cooldown-ms: 2000

gui-click-shield:
  enabled: true
  cooldown-ms: 400

anti-abuse:
  enabled: true
  macro-threshold-ms: 20
  command-cooldown-ms: 1000

# ── Sound ────────────────────────────────────────────────────────────────────

sound:
  enabled: true
  rankup:
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.0
  gui-click:
    sound: "UI_BUTTON_CLICK"
    volume: 0.5
    pitch: 1.0
  gui-open:
    sound: "BLOCK_CHEST_OPEN"
    volume: 0.7
    pitch: 1.0

# ── Announcements ────────────────────────────────────────────────────────────

announcements:
  enabled: true
  rankup:
    broadcast: true
    message: "§6[RankForge] §e%player% §ahas ranked up to §6%rank%§a!"
    title:
      enabled: true
      title: "§6✦ Rank Up! ✦"
      subtitle: "§eYou are now §a%rank%"
      fade-in: 10
      stay: 60
      fade-out: 10
    action-bar:
      enabled: true
      message: "§a✦ You ranked up to §e%rank% §a✦"

# ── Cosmetics ─────────────────────────────────────────────────────────────────

cosmetic:
  bossbar:
    enabled: true
    duration-ticks: 100

  particles:
    enabled: true
    ranks:
      Guest:   "CRIT"
      Member:  "VILLAGER_HAPPY"
      Builder: "NOTE"
      Expert:  "FLAME"
      Elite:   "TOTEM"

  join-quit:
    enabled: true
    join-message: "{prefix}§e{player} §ajoined the server."
    quit-message: "{prefix}§e{player} §cleft the server."

  tablist:
    enabled: true
    format: "{prefix}{player}"

# ── Performance ───────────────────────────────────────────────────────────────

performance:
  tps-monitor:
    enabled: true
    sample-ticks: 100
  modes:
    high-tps-threshold: 18.0
    medium-tps-threshold: 14.0

# ── GUI ──────────────────────────────────────────────────────────────────────

gui:
  rows: 6
  admin-rows: 6

# ── Sync & Cache ─────────────────────────────────────────────────────────────

sync:
  interval-ticks: 200

cache:
  ttl-minutes: 10
  purge-interval-ticks: 6000

# ── YAML Ranks ───────────────────────────────────────────────────────────────

yaml-ranks:
  enabled: true
  file: "ranks.yml"
  backup-on-save: true

requirements:
  enabled: true
  types:
    - money
    - xp-level
    - permission

ranks:
  default-rank: "Guest"
