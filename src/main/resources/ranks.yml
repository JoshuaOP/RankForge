# ==============================================================================
#   RankForge — Rank Definitions
#   Author: JoshuaOP
#
#   Edit ranks here or in-game via /rank editor
#   Hot-reload: /rank editor reload   |   Save to disk: /rank editor save
#
#   Available requirement fields (all optional — omit any you don't need):
#     money             — Vault balance required          (e.g. 5000.0)
#     xp-level          — Minecraft XP level              (e.g. 10)
#     permission        — Permission node player must have (e.g. vip.access)
#     playtime-minutes  — Total playtime in minutes        (e.g. 120)
#     mob-kills         — Total mob kills (vanilla stat)   (e.g. 50)
#     block-breaks      — Total blocks mined (vanilla stat)(e.g. 500)
#     statistic-id      — Untyped Bukkit Statistic name    (e.g. JUMP, DEATHS)
#     statistic-value   — Required value for statistic-id  (e.g. 100)
#     quests            — List of quest IDs (checked via permission node:
#                         rankforge.quest.completed.<questId>)
#     worlds            — Player must be in one of these worlds when ranking up
#     items             — Map of MATERIAL: amount required in inventory
# ==============================================================================

ranks:

  # ── Guest — Default starting rank, no requirements ──────────────────────────
  Guest:
    display-name: "§7Guest"
    next-rank: "Member"
    slot: 10
    material: GRAY_WOOL
    chat-prefix: "§7[Guest] "
    lore:
      - "§7The default starting rank."
      - "§8No requirements to hold."
    permissions: []
    commands:
      - "broadcast §a%player% §7has joined as §7Guest!"
    requirements:
      money: 0
      xp-level: 0
      permission: ""

  # ── Member — Rewards basic activity ─────────────────────────────────────────
  Member:
    display-name: "§aMember"
    next-rank: "Builder"
    slot: 12
    material: GREEN_WOOL
    chat-prefix: "§a[Member] "
    lore:
      - "§7Requires basic in-game activity."
      - "§8Earn money, level up, play a bit."
    permissions:
      - "essentials.kits.member"
      - "essentials.home"
    commands:
      - "broadcast §6✦ §e%player% §aranked up to §aMember§a! ✦"
      - "title %player% subtitle {\"text\":\"You are now Member!\",\"color\":\"green\"}"
    requirements:
      money: 5000
      xp-level: 10
      playtime-minutes: 60
      mob-kills: 25
      block-breaks: 200

  # ── Builder — Demonstrates quest + statistic requirements ───────────────────
  Builder:
    display-name: "§9Builder"
    next-rank: "Expert"
    slot: 14
    material: BLUE_WOOL
    chat-prefix: "§9[Builder] "
    lore:
      - "§7Requires: §a$15,000 §7& §aLevel 25"
      - "§7Complete the intro quest first!"
    permissions:
      - "minecraft.command.gamemode"
      - "worldedit.generation.sphere"
    commands:
      - "broadcast §6✦ §e%player% §9ranked up to §9Builder§9! ✦"
    requirements:
      money: 15000
      xp-level: 25
      playtime-minutes: 300
      mob-kills: 100
      block-breaks: 2000
      # ── Quest requirement ────────────────────────────────────────────────────
      # Any quest plugin that grants rankforge.quest.completed.intro_quest
      # on quest completion will satisfy this requirement.
      quests:
        - intro_quest
      # ── Statistic requirement ────────────────────────────────────────────────
      # Player must have jumped at least 100 times.
      statistic-id: "JUMP"
      statistic-value: 100

  # ── Expert — Demonstrates world + item requirements ─────────────────────────
  Expert:
    display-name: "§6Expert"
    next-rank: "Elite"
    slot: 16
    material: ORANGE_WOOL
    chat-prefix: "§6[Expert] "
    lore:
      - "§7Requires: §a$50,000 §7& §aLevel 50"
      - "§7Must be in the overworld with §a5 Diamonds§7."
    permissions:
      - "essentials.sethome.multiple.3"
    commands:
      - "broadcast §6✦ §e%player% §6ranked up to §6Expert§6! ✦"
    requirements:
      money: 50000
      xp-level: 50
      playtime-minutes: 1200
      mob-kills: 500
      block-breaks: 10000
      # ── World requirement ────────────────────────────────────────────────────
      # Player must be in the overworld when they use /rank up.
      worlds:
        - world
      # ── Item requirement ─────────────────────────────────────────────────────
      # Player must have at least 5 diamonds in their inventory.
      items:
        DIAMOND: 5
      quests:
        - intro_quest
        - explore_quest

  # ── Elite — Max rank, demonstrates all requirement types together ─────────────
  Elite:
    display-name: "§c§lElite"
    next-rank: ""
    slot: 22
    material: RED_WOOL
    chat-prefix: "§c§l[Elite] "
    lore:
      - "§7Requires: §a$100,000 §7& §aLevel 100"
      - "§6§l✦ Maximum Rank! ✦"
    permissions:
      - "essentials.fly"
      - "essentials.repair"
    commands:
      - "broadcast §4✦ §c%player% §6has reached the §c§lMAX rank — Elite§6! ✦"
      - "give %player% diamond 5"
      - "effect give %player% speed 300 1"
    requirements:
      money: 100000
      xp-level: 100
      permission: ""
      playtime-minutes: 6000
      mob-kills: 2000
      block-breaks: 50000
      worlds:
        - world
        - world_nether
        - world_the_end
      items:
        NETHER_STAR: 1
      quests:
        - intro_quest
        - explore_quest
        - master_quest
      # Player must have fewer than 100 deaths on record.
      statistic-id: "DEATHS"
      statistic-value: 100
