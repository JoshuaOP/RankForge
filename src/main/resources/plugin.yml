name: RankForge
version: ${project.version}
main: com.joshuaop.rankforge.RankForge
api-version: "1.21"
authors:
  - JoshuaOP
description: A modular, production-ready rank management plugin with full Developer API.
website: https://github.com/JoshuaOP/RankForge

soft-depend:
  - Vault
  - LuckPerms
  - PermissionsEx
  - PlaceholderAPI
  - EssentialsChat
  - DeluxeTags
  - floodgate
  - Geyser-Spigot

commands:
  rank:
    description: Main RankForge command.
    usage: /rank [subcommand]
    aliases:
      - ranks
    permission: rankforge.use

permissions:

  # ── Top-level Wildcard ───────────────────────────────────────────────────────
  rankforge.*:
    description: Grants all RankForge permissions.
    default: op
    children:
      rankforge.use.*: true
      rankforge.admin.*: true

  # ── Player Wildcard ──────────────────────────────────────────────────────────
  rankforge.use.*:
    description: Grants access to all player commands.
    default: true
    children:
      rankforge.use: true
      rankforge.use.up: true
      rankforge.use.current: true
      rankforge.use.next: true
      rankforge.use.progress: true
      rankforge.use.requirements: true
      rankforge.use.history: true
      rankforge.use.help: true
      rankforge.use.lang: true
      rankforge.use.version: true
      rankforge.use.xp: true

  # ── Player Permissions ───────────────────────────────────────────────────────
  rankforge.use:
    description: Open the rank GUI (/rank).
    default: true
  rankforge.use.up:
    description: Rank up (/rank up).
    default: true
  rankforge.use.current:
    description: View current rank (/rank current).
    default: true
  rankforge.use.next:
    description: View next rank info (/rank next).
    default: true
  rankforge.use.progress:
    description: View rank progress bar (/rank progress).
    default: true
  rankforge.use.requirements:
    description: View rank requirements (/rank requirements).
    default: true
  rankforge.use.history:
    description: View personal rank history (/rank history).
    default: true
  rankforge.use.help:
    description: View command help (/rank help).
    default: true
  rankforge.use.lang:
    description: Change language setting (/rank lang).
    default: true
  rankforge.use.version:
    description: View plugin version info (/rank version).
    default: true
  rankforge.use.xp:
    description: View personal XP info (/rank xp).
    default: true

  # ── Admin Wildcard ───────────────────────────────────────────────────────────
  rankforge.admin.*:
    description: Grants access to all administrator commands.
    default: op
    children:
      rankforge.admin.reload: true
      rankforge.admin.editor: true
      rankforge.admin.playerlist: true
      rankforge.admin.create: true
      rankforge.admin.delete: true
      rankforge.admin.set: true
      rankforge.admin.force: true
      rankforge.admin.reset: true
      rankforge.admin.bypassreq: true
      rankforge.admin.stats: true
      rankforge.admin.debug: true
      rankforge.admin.security: true
      rankforge.admin.sound: true
      rankforge.admin.xp: true

  # ── Admin Permissions ────────────────────────────────────────────────────────
  rankforge.admin.reload:
    description: Reload plugin configuration (/rank reload).
    default: op
  rankforge.admin.editor:
    description: Open the admin rank editor (/rank editor).
    default: op
  rankforge.admin.playerlist:
    description: View and edit all player data (/rank playerlist).
    default: op
  rankforge.admin.create:
    description: Create a new rank (/rank create).
    default: op
  rankforge.admin.delete:
    description: Delete a rank (/rank delete).
    default: op
  rankforge.admin.set:
    description: Set a player's rank (/rank set).
    default: op
  rankforge.admin.force:
    description: Force-set a rank bypassing requirements (/rank force).
    default: op
  rankforge.admin.reset:
    description: Reset a player's rank (/rank reset).
    default: op
  rankforge.admin.bypassreq:
    description: Instantly complete a requirement for a player (/rank bypassreq).
    default: op
  rankforge.admin.stats:
    description: View system statistics (/rank stats).
    default: op
  rankforge.admin.debug:
    description: View rank debug info (/rank debug).
    default: op
  rankforge.admin.security:
    description: View anti-bypass status (/rank security).
    default: op
  rankforge.admin.sound:
    description: Manage sound settings (/rank sound).
    default: op
  rankforge.admin.xp:
    description: Set or add XP for other players (/rank xp set, /rank xp add).
    default: op
