# ============================================================
#   RankForge — Quests Configuration
#   Define multi-step quests composed of challenge sequences.
#
#   Each quest has:
#     name            - Display name
#     description     - Short description
#     rank-required   - Restrict to a specific rank ID (empty = all)
#     repeatable      - Whether the quest resets after completion
#     steps           - Ordered list of challenge IDs to complete in sequence
#     reward-xp       - RankForge XP granted on full quest completion
#     reward-money    - Vault money granted on completion
#     reward-commands - Console commands on completion (%player% supported)
#     reward-message  - Message sent to player on completion (& codes)
#
#   Note: Each step references a challenge ID from challenges.yml.
#   Players complete steps in order — each step must be fully completed
#   before the next becomes active.
# ============================================================

quests:

  newcomer_path:
    name: "Newcomer's Path"
    description: "A starter quest for new players — mine, fight, and craft!"
    rank-required: ""
    repeatable: false
    steps:
      - challenge: "daily_miner"
      - challenge: "mob_slayer"
      - challenge: "master_crafter"
    reward-xp: 500
    reward-money: 500.0
    reward-commands:
      - "give %player% bread 16"
    reward-message: "§a✦ Quest Complete: §6Newcomer's Path§a! §7You've proven yourself."

  the_grind:
    name: "The Grind"
    description: "For dedicated players — kill mobs, mine, and rank up."
    rank-required: "Member"
    repeatable: false
    steps:
      - challenge: "mob_slayer"
      - challenge: "daily_miner"
      - challenge: "rank_climber"
    reward-xp: 1500
    reward-money: 2500.0
    reward-commands:
      - "give %player% diamond 5"
      - "give %player% gold_ingot 10"
    reward-message: "§a✦ Quest Complete: §6The Grind§a! §7True dedication."

  elite_journey:
    name: "Elite Journey"
    description: "The ultimate quest for Expert players seeking Elite status."
    rank-required: "Expert"
    repeatable: false
    steps:
      - challenge: "elite_miner"
      - challenge: "mob_slayer"
      - challenge: "master_crafter"
    reward-xp: 5000
    reward-money: 10000.0
    reward-commands:
      - "give %player% netherite_ingot 1"
      - "give %player% diamond 10"
    reward-message: "§6✦ §lELITE QUEST COMPLETE§r§6! §eYou've earned the title of Elite."
