# ============================================================
#   RankForge — GUI Configuration
#   All GUI layout, title, border, and slot settings live here.
#   Use & color codes (&6=gold, &a=green, &c=red, &8=dark_grey, etc.)
#   Material names must match Bukkit Material enum values (ALL_CAPS).
#   Row count settings are in config.yml under the 'gui' section.
# ============================================================

# ── Player-facing rank tree GUI  (/rank) ────────────────────────────────────

player-gui:
  title: "&8✦ &6RankForge &8✦"
  border-material: CYAN_STAINED_GLASS_PANE
  head-slot: 4
  info-slot: 49

# ── Admin overview editor  (/rank editor) ───────────────────────────────────

admin-gui:
  title: "&8✦ &cAdmin Rank Editor &8✦"
  border-material: RED_STAINED_GLASS_PANE

# ── Per-rank detail editor  (click a rank in the admin editor) ──────────────

detail-editor:
  title-prefix: "&8✦ &6Editing: "
  border-top: LIME_STAINED_GLASS_PANE
  border-bottom: GRAY_STAINED_GLASS_PANE

# ── Drag-and-drop slot reassignment editor ─────────────────────────────────

drag-drop:
  title: "&8✦ &bSlot Editor &8✦"

# ── Player List GUI  (/rank playerlist) ─────────────────────────────────────

player-list:
  title: "&8✦ &9Player List &8✦"
  border-material: BLUE_STAINED_GLASS_PANE
  prev-page-slot: 45
  next-page-slot: 53
  close-slot: 49

# ── Player Data Editor GUI  (click a player in the player list) ─────────────

player-data-editor:
  title-prefix: "&8✦ &9Editing: "
  border-material: LIGHT_BLUE_STAINED_GLASS_PANE

# ── Leaderboard GUI  (/rank leaderboard) ───────────────────────────────────

leaderboard:
  title: "&8✦ &6Leaderboard &8✦"
  border-material: YELLOW_STAINED_GLASS_PANE
  sort-by-xp-slot: 45
  sort-by-rank-slot: 46
  close-slot: 49
  entry-start-slot: 9
  # Colors for position 1, 2, 3 (top 3 special treatment)
  gold-material: GOLD_BLOCK
  silver-material: IRON_BLOCK
  bronze-material: BRICK

# ── Daily Rewards GUI  (/rank daily — future GUI support) ───────────────────

daily-reward:
  title: "&8✦ &aDailyReward &8✦"
  border-material: LIME_STAINED_GLASS_PANE
  available-material: CHEST
  cooldown-material: CLOCK
  border-available: LIME_STAINED_GLASS_PANE
  border-cooldown: ORANGE_STAINED_GLASS_PANE

# ── Challenges GUI  (/rank challenges — future GUI support) ──────────────────

challenges:
  title: "&8✦ &eChallenges &8✦"
  border-material: ORANGE_STAINED_GLASS_PANE
  active-material: BOOK
  completed-material: ENCHANTED_BOOK
  cooldown-material: CLOCK

# ── Quests GUI  (/rank quests — future GUI support) ──────────────────────────

quests:
  title: "&8✦ &bQuests &8✦"
  border-material: PURPLE_STAINED_GLASS_PANE
  in-progress-material: MAP
  completed-material: FILLED_MAP

# ── Rank History GUI  (/rank history — future GUI support) ───────────────────

history:
  title: "&8✦ &7Rank History &8✦"
  border-material: GRAY_STAINED_GLASS_PANE
  rankup-material: EMERALD
  set-material: DIAMOND
  reset-material: REDSTONE

# ── Common shared settings ───────────────────────────────────────────────────

common:
  # Filler item used for empty border slots
  filler-material: GRAY_STAINED_GLASS_PANE
  # Close/Back button
  close-material: BARRIER
  close-name: "&cClose"
  back-material: ARROW
  back-name: "&7Back"
